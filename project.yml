name: Timebase
options:
  bundleIdPrefix: cc.timebase
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "2.2.1"

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Timebase:
    type: application
    platform: iOS
    sources:
      - Sources/Timebase
    resources:
      - path: Sources/Timebase/Assets.xcassets
        optional: true
      - path: Sources/Timebase/Resources/cities.json
      - path: Sources/Timebase/Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Timebase/Info.plist
      properties:
        CFBundleDisplayName: Timebase
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: "Timebase shows your upcoming events as live countdowns."
        NSLocationWhenInUseUsageDescription: "Timebase uses your location to set your home city."
        NSUbiquitousKeyValueStoreUsageDescription: "Timebase syncs your cities across your devices via iCloud."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        UIAppFonts:
          - CrimsonText-SemiBold.ttf
          - DepartureMono-Regular.otf
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: cc.timebase.ios
            CFBundleURLSchemes:
              - timebase
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: cc.timebase.shortcut.scheduler
            UIApplicationShortcutItemTitle: Plan a meeting
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose
          - UIApplicationShortcutItemType: cc.timebase.shortcut.upnext
            UIApplicationShortcutItemTitle: Up Next
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeDate
          - UIApplicationShortcutItemType: cc.timebase.shortcut.settings
            UIApplicationShortcutItemTitle: Settings
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeFavorite
    dependencies:
      - target: TimebaseWidgets
      - target: TimebaseWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.timebase.ios
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Sources/Timebase/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Sources/Timebase/Timebase.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-FullDay AppIcon-Morning AppIcon-Midday AppIcon-GoldenHour AppIcon-Dusk"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        DEVELOPMENT_TEAM: VRNNS4H6XH

  TimebaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TimebaseTests
    dependencies:
      - target: Timebase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.timebase.ios.tests
        SWIFT_VERSION: "6.0"

  TimebaseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TimebaseWidgets
      - path: Sources/Timebase/LiveActivity/EventCountdownAttributes.swift
    info:
      path: TimebaseWidgets/Info.plist
      properties:
        CFBundleDisplayName: Timebase Widgets
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.timebase.ios.widgets
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: TimebaseWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimebaseWidgets/TimebaseWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: VRNNS4H6XH
        SKIP_INSTALL: "NO"

  TimebaseWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/TimebaseWatch
        excludes:
          - "Brand/Fonts/*"
      - path: Sources/TimebaseWatch/Assets.xcassets
        buildPhase: resources
      - path: Sources/TimebaseWatch/Brand/Fonts
        buildPhase: resources
      - path: Sources/TimebaseWatch/Resources/cities.json
        buildPhase: resources
    info:
      path: Sources/TimebaseWatch/Info.plist
      properties:
        CFBundleDisplayName: Timebase
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        NSCalendarsFullAccessUsageDescription: "Timebase shows your upcoming events as live countdowns."
        NSUbiquitousKeyValueStoreUsageDescription: "Timebase syncs your cities across your devices via iCloud."
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - CrimsonText-SemiBold.ttf
          - DepartureMono-Regular.otf
        CFBundleURLTypes:
          - CFBundleURLName: cc.timebase.ios.watchkitapp
            CFBundleURLSchemes:
              - timebase
    dependencies:
      - target: TimebaseWatchComplications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.timebase.ios.watchkitapp
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: Sources/TimebaseWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/TimebaseWatch/TimebaseWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: VRNNS4H6XH

  TimebaseWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: TimebaseWatchComplications
      - path: TimebaseWatchComplications/Assets.xcassets
        buildPhase: resources
      - path: Sources/TimebaseWatch/Brand
        excludes:
          - "Fonts/*"
      - path: Sources/TimebaseWatch/Models
      - path: Sources/TimebaseWatch/Sync
      - path: Sources/TimebaseWatch/LiveActivity/EventCountdownAttributes.swift
      - path: Sources/TimebaseWatch/Resources/cities.json
        buildPhase: resources
    info:
      path: TimebaseWatchComplications/Info.plist
      properties:
        CFBundleDisplayName: Timebase
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.timebase.ios.watchkitapp.complications
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: TimebaseWatchComplications/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimebaseWatchComplications/TimebaseWatchComplications.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: VRNNS4H6XH
        SKIP_INSTALL: "NO"

  TimebaseMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/TimebaseMac
        excludes:
          - "Brand/Fonts/*"
      - path: Sources/TimebaseMac/Assets.xcassets
        buildPhase: resources
      - path: Sources/TimebaseMac/Brand/Fonts
        buildPhase: resources
      - path: Sources/TimebaseMac/Resources/cities.json
        buildPhase: resources
    info:
      path: Sources/TimebaseMac/Info.plist
      properties:
        CFBundleDisplayName: Timebase
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: "Timebase shows your upcoming events as live countdowns."
        NSUbiquitousKeyValueStoreUsageDescription: "Timebase syncs your cities across your devices via iCloud."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: cc.timebase.ios
            CFBundleURLSchemes:
              - timebase
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.timebase.ios
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: Sources/TimebaseMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/TimebaseMac/TimebaseMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: VRNNS4H6XH
        ENABLE_HARDENED_RUNTIME: "YES"

schemes:
  Timebase:
    build:
      targets:
        Timebase: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimebaseTests
    archive:
      config: Release
  TimebaseWatch:
    build:
      targets:
        TimebaseWatch: all
    run:
      config: Debug
    archive:
      config: Release
  TimebaseMac:
    build:
      targets:
        TimebaseMac: all
    run:
      config: Debug
    archive:
      config: Release
